name: Bug report
description: Something in the Lab does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Lab URL
      description: Copy the URL from the address bar (it carries the season, race and selection).
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, or how you run the Lab (npm run dev, Docker, Vercel) and its version.
  - type: textarea
    id: logs
    attributes:
      label: Console output or screenshots
      render: shell
