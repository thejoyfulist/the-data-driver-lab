name: Feature request
description: Suggest a new view, export or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What question should the Lab help answer?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Which API endpoints would it use?
      description: See docs/API.md. Views only display published data.
