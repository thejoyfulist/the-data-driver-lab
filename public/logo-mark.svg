<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Symbol mark: three converging data lines forming abstract trajectory -->
  <g>
    <path d="M4 4 L20 16 L4 28" stroke="#FAFAF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 8 L24 16 L10 24" stroke="#FAFAF8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    <path d="M16 12 L26 16 L16 20" stroke="#FAFAF8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <!-- Convergence point -->
    <circle cx="26" cy="16" r="2" fill="#FAFAF8"/>
  </g>
</svg>
